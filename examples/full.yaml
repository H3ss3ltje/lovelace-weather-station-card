# Full configuration with every entity and all optional features enabled.
type: custom:weather-station-card
title: Weather Station
temperature_entity: sensor.temperature
humidity_entity: sensor.humidity
lux_entity: sensor.lux
uv_entity: sensor.uv
rain_entity: sensor.rain
wind_speed_entity: sensor.wind_speed
wind_direction_entity: sensor.wind_direction
wind_gust_entity: sensor.wind_gust
pressure_entity: sensor.pressure
battery_entity: sensor.battery
sun_entity: sun.sun
# Optional — only if you don't use sun.sun attributes:
# azimuth_entity: sensor.sun_azimuth
# elevation_entity: sensor.sun_elevation
# Optional — dedicated daily min/max + rain total sensors.
# If omitted, today's min/max is tracked in the browser instead.
# temperature_min_entity: sensor.temperature_min
# temperature_max_entity: sensor.temperature_max
# rain_today_entity: sensor.rain_today

settings:
  show_dewpoint: true
  show_pressure_trend: false
  show_battery: true
  show_wind_gust: true
  show_interactions: true
  show_daynight: true
  show_sun: true
  show_minmax: true # today's min / max temperature in the hero
  show_rain_today: true # rain total today (needs rain_today_entity)
  show_beaufort: true # Beaufort number + description under wind
  compact_mode: false # true = hero + sun only (hide tile grid)
  night_palette: true # stronger moon / night path after sunset
  # Optional tile order for the full-station grid:
  # tile_order:
  #   - lux
  #   - temperature
  #   - humidity
  #   - rain
  #   - wind
  #   - uv
  #   - pressure
  #   - battery

# Optional per-section tap / hold / double-tap actions.
# Any Home Assistant action is supported: more-info, navigate, url,
# call-service, toggle, none.
temperature_action:
  tap_action:
    action: more-info
humidity_action:
  tap_action:
    action: more-info
wind_action:
  tap_action:
    action: navigate
    navigation_path: /lovelace/wind
rain_action:
  tap_action:
    action: url
    url_path: https://www.buienradar.nl
