# No sun entity — day/night disabled, condition set manually.
type: custom:weather-station-card
title: Greenhouse
temperature_entity: sensor.greenhouse_temperature
humidity_entity: sensor.greenhouse_humidity
lux_entity: sensor.greenhouse_lux

settings:
